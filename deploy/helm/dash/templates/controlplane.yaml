{{- if .Values.controlPlane.enabled }}
{{- /*
Control-plane workload: shard placement metadata and a file-backed leader
lease. Fixed at one replica (scaling needs a shared volume or an external
coordinator). Requires DASH_CONTROL_PLANE_TOKEN (secret.controlPlane.token).
*/ -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dash.componentName" (list . "control-plane") }}
  namespace: {{ include "dash.namespace" . }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "dash.controlPlaneSelectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.service.ports.controlPlane }}
    targetPort: http
    protocol: TCP
    appProtocol: {{ ternary "https" "http" .Values.tls.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dash.componentName" (list . "control-plane") }}
  namespace: {{ include "dash.namespace" . }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  serviceName: {{ include "dash.componentName" (list . "control-plane") }}
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "dash.controlPlaneSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dash.controlPlaneSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pods when the rendered ConfigMap or chart-managed Secrets
        # change: envFrom is read only at container start, so without this
        # a `helm upgrade` that changes config.* or secret.* did nothing
        # until the pods happened to restart.
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "dash.controlPlaneServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- include "dash.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      initContainers:
      {{- include "dash.initDataDirs" (list . (include "dash.controlPlaneImage" .) "/var/lib/dash/state") | nindent 6 }}
      containers:
      - name: control-plane
        image: {{ include "dash.controlPlaneImage" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        # Matches the image ENTRYPOINT; DASH_BIN selects the binary.
        command: ["/opt/dash/bin/dash-entrypoint"]
        args: ["--serve"]
        env:
        - name: DASH_BIN
          value: "control-plane"
        - name: DASH_CONTROL_PLANE_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: {{ include "dash.fullname" . }}-config
        - secretRef:
            name: {{ include "dash.controlPlaneSecretName" . }}
        ports:
        - name: http
          containerPort: 8090
          protocol: TCP
        resources:
          {{- include "dash.resources" (list . "controlPlane") | nindent 10 }}
        startupProbe:
          httpGet:
            path: /v1/control-plane/ready
            port: http
            scheme: {{ include "dash.probeScheme" . }}
          initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          failureThreshold: {{ .Values.probes.startup.failureThreshold }}
        livenessProbe:
          httpGet:
            path: /v1/control-plane/health
            port: http
            scheme: {{ include "dash.probeScheme" . }}
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          successThreshold: 1
          failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
        readinessProbe:
          httpGet:
            path: /v1/control-plane/ready
            port: http
            scheme: {{ include "dash.probeScheme" . }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          successThreshold: 1
          failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 12 }}
        volumeMounts:
        - name: data
          mountPath: {{ .Values.config.persistencePath }}
        # Writable scratch space. /opt/dash is NOT mounted over: it holds
        # the image's binaries and entrypoint.
        - name: tmp
          mountPath: /tmp
        {{- include "dash.tlsVolumeMount" . | nindent 8 }}
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      {{- include "dash.tlsVolume" . | nindent 6 }}
      {{- if not .Values.persistence.enabled }}
      - name: data
        emptyDir: {}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app.kubernetes.io/part-of: dash
        app.kubernetes.io/component: control-plane
    spec:
      accessModes:
        {{- toYaml .Values.persistence.accessModes | nindent 8 }}
      {{- if .Values.persistence.storageClassName }}
      storageClassName: {{ .Values.persistence.storageClassName | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size | quote }}
  {{- end }}
{{- end }}
