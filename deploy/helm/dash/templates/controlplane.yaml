{{- /*
Control-plane workload. Renders Service + StatefulSet.
The control-plane owns shard placement metadata and leader election.
Leader election is currently file-backed, so replicas >1 requires a
shared ReadWriteMany volume (or an external coordinator) and is left
for a future CRD-based operator.
*/ -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dash.componentName" (list . "control-plane") }}
  namespace: {{ .Values.namespace.name | default "dash-system" }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "dash.controlPlaneSelectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.service.ports.controlPlane }}
    targetPort: http
    protocol: TCP
    appProtocol: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dash.componentName" (list . "control-plane") }}
  namespace: {{ .Values.namespace.name | default "dash-system" }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  serviceName: {{ include "dash.componentName" (list . "control-plane") }}
  replicas: {{ .Values.replicas.controlPlane }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "dash.controlPlaneSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dash.controlPlaneSelectorLabels" . | nindent 8 }}
      {{- with .Values.podLabels }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dash.controlPlaneServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- include "dash.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
      - name: control-plane
        image: {{ include "dash.controlPlaneImage" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/opt/dash/bin/dash-entrypoint"]
        args: ["--serve"]
        env:
        - name: DASH_BIN
          value: "control-plane"
        - name: DASH_CONTROL_PLANE_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: {{ include "dash.fullname" . }}-config
        ports:
        - name: http
          containerPort: 8090
          protocol: TCP
        resources:
          {{- $r := merge (deepCopy .Values.resources) (default (dict) .Values.resources.controlPlane) }}
          {{- $req := dig "requests" (dict) $r }}
          {{- $lim := dig "limits" (dict) $r }}
          requests:
            {{- toYaml $req | nindent 12 }}
          limits:
            {{- toYaml $lim | nindent 12 }}
        startupProbe:
          exec:
            command: ["wget", "-qO-", "http://localhost:8090/v1/control-plane/health"]
          initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          failureThreshold: {{ .Values.probes.startup.failureThreshold }}
        livenessProbe:
          exec:
            command: ["wget", "-qO-", "http://localhost:8090/v1/control-plane/health"]
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          successThreshold: 1
          failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
        readinessProbe:
          exec:
            command: ["wget", "-qO-", "http://localhost:8090/v1/control-plane/ready"]
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          successThreshold: 1
          failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 12 }}
        volumeMounts:
        - name: data
          mountPath: {{ .Values.config.persistencePath }}
        - name: tmp
          mountPath: /tmp
        - name: home
          mountPath: /opt/dash
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: home
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app.kubernetes.io/part-of: dash
        app.kubernetes.io/component: control-plane
    spec:
      accessModes:
        {{- toYaml .Values.persistence.accessModes | nindent 8 }}
      {{- if .Values.persistence.storageClassName }}
      storageClassName: {{ .Values.persistence.storageClassName | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size | quote }}
  {{- end }}
