{{- if .Values.networkPolicy.enabled -}}
{{- $ns := include "dash.namespace" . -}}
{{- $cidrs := .Values.networkPolicy.internalCIDRs -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dash.fullname" . }}-default-deny
  namespace: {{ $ns }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dash.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dash.fullname" . }}-allow-dns
  namespace: {{ $ns }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dash.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
# Retrieval: replicate from ingestion, reach external HTTPS providers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dash.fullname" . }}-retrieval-egress
  namespace: {{ $ns }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: retrieval
spec:
  podSelector:
    matchLabels:
      {{- include "dash.retrievalSelectorLabels" . | nindent 6 }}
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          {{- include "dash.ingestionSelectorLabels" . | nindent 10 }}
    ports:
    - port: http
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        {{- range $cidrs }}
        - {{ . }}
        {{- end }}
    ports:
    {{- range .Values.networkPolicy.externalEgressPorts }}
    - port: {{ .port }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
---
# Ingestion: external HTTPS providers only (inbound traffic is allowed below).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dash.fullname" . }}-ingestion-egress
  namespace: {{ $ns }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
spec:
  podSelector:
    matchLabels:
      {{- include "dash.ingestionSelectorLabels" . | nindent 6 }}
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        {{- range $cidrs }}
        - {{ . }}
        {{- end }}
    ports:
    {{- range .Values.networkPolicy.externalEgressPorts }}
    - port: {{ .port }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
{{- if .Values.networkPolicy.ollama.enabled }}
---
# In-cluster Ollama on private CIDRs (retrieval and ingestion pods).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dash.fullname" . }}-ollama-egress
  namespace: {{ $ns }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/instance
      operator: In
      values: [{{ .Release.Name | quote }}]
    - key: app.kubernetes.io/component
      operator: In
      values: [retrieval, ingestion]
  policyTypes:
  - Egress
  egress:
  - to:
    {{- range (default $cidrs .Values.networkPolicy.ollama.cidrs) }}
    - ipBlock:
        cidr: {{ . }}
    {{- end }}
    ports:
    - port: {{ .Values.networkPolicy.ollama.port }}
      protocol: TCP
{{- end }}
---
# Ingress controller -> retrieval and ingestion HTTP ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dash.fullname" . }}-allow-ingress-controller
  namespace: {{ $ns }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dash.selectorLabels" . | nindent 6 }}
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: In
      values: [retrieval, ingestion]
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      podSelector:
        {{- toYaml .Values.networkPolicy.ingressPodSelector | nindent 8 }}
    ports:
    - port: http
      protocol: TCP
---
# Retrieval pods -> ingestion (WAL replication).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dash.fullname" . }}-retrieval-to-ingestion
  namespace: {{ $ns }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
spec:
  podSelector:
    matchLabels:
      {{- include "dash.ingestionSelectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "dash.retrievalSelectorLabels" . | nindent 10 }}
    ports:
    - port: http
      protocol: TCP
{{- if .Values.controlPlane.enabled }}
---
# Retrieval and ingestion <-> control plane.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dash.fullname" . }}-control-plane
  namespace: {{ $ns }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  podSelector:
    matchLabels:
      {{- include "dash.controlPlaneSelectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          {{- include "dash.selectorLabels" . | nindent 10 }}
        matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values: [retrieval, ingestion]
    ports:
    - port: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dash.fullname" . }}-control-plane-egress
  namespace: {{ $ns }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dash.selectorLabels" . | nindent 6 }}
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: In
      values: [retrieval, ingestion]
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          {{- include "dash.controlPlaneSelectorLabels" . | nindent 10 }}
    ports:
    - port: http
      protocol: TCP
{{- end }}
{{- end }}
