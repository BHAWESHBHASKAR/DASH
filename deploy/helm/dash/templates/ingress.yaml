{{- if .Values.ingress.enabled -}}
{{- $svcPort := .Values.service.ports.http -}}
{{- $expose := .Values.ingress.exposeIngestion -}}
{{- $ing := include "dash.componentName" (list . "ingestion") -}}
{{- $ret := include "dash.componentName" (list . "retrieval") -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dash.fullname" . }}
  namespace: {{ include "dash.namespace" . }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
  - host: {{ .host | quote }}
    http:
      paths:
      {{- if $expose }}
      {{- range $.Values.ingress.ingestionPaths }}
      - path: {{ .path }}
        pathType: {{ .pathType | default "Prefix" }}
        backend:
          service:
            name: {{ $ing }}
            port:
              number: {{ $svcPort }}
      {{- end }}
      {{- end }}
      {{- range $.Values.ingress.retrievalPaths }}
      - path: {{ .path }}
        pathType: {{ .pathType | default "Prefix" }}
        backend:
          service:
            name: {{ $ret }}
            port:
              number: {{ $svcPort }}
      {{- end }}
  {{- end }}
{{- end }}
