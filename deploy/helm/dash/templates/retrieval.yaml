{{- /*
Retrieval workload: Service + StatefulSet. Every replica has its own
PVC and follows the single ingestion pod via WAL replication. Scale manually;
there is no HPA.
*/ -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dash.componentName" (list . "retrieval") }}
  namespace: {{ include "dash.namespace" . }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: retrieval
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "dash.retrievalSelectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.service.ports.http }}
    targetPort: http
    protocol: TCP
    appProtocol: {{ ternary "https" "http" .Values.tls.enabled }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dash.componentName" (list . "retrieval") }}
  namespace: {{ include "dash.namespace" . }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: retrieval
spec:
  serviceName: {{ include "dash.componentName" (list . "retrieval") }}
  replicas: {{ .Values.replicas.retrieval }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "dash.retrievalSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dash.retrievalSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dash.retrievalServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- include "dash.imagePullSecrets" . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      initContainers:
      {{- include "dash.initDataDirs" (list . (include "dash.retrievalImage" .) "/var/lib/dash/state /var/lib/dash/segments /var/lib/dash/audit") | nindent 6 }}
      containers:
      - name: retrieval
        image: {{ include "dash.retrievalImage" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        # Matches the image ENTRYPOINT; DASH_BIN selects the binary.
        command: ["/opt/dash/bin/dash-entrypoint"]
        args: ["--serve"]
        env:
        - name: DASH_BIN
          value: "retrieval"
        envFrom:
        - configMapRef:
            name: {{ include "dash.fullname" . }}-config
        - secretRef:
            name: {{ include "dash.retrievalSecretName" . }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          {{- include "dash.resources" (list . "retrieval") | nindent 10 }}
        startupProbe:
          httpGet:
            path: {{ .Values.probes.startup.path }}
            port: http
            scheme: {{ include "dash.probeScheme" . }}
          initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          failureThreshold: {{ .Values.probes.startup.failureThreshold }}
        livenessProbe:
          httpGet:
            path: {{ .Values.probes.liveness.path }}
            port: http
            scheme: {{ include "dash.probeScheme" . }}
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          successThreshold: 1
          failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
        readinessProbe:
          httpGet:
            path: {{ .Values.probes.readiness.path }}
            port: http
            scheme: {{ include "dash.probeScheme" . }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          successThreshold: 1
          failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
        securityContext:
          {{- toYaml .Values.containerSecurityContext | nindent 12 }}
        volumeMounts:
        - name: data
          mountPath: {{ .Values.config.persistencePath }}
        # Writable scratch space. /opt/dash is NOT mounted over: it holds
        # the image's binaries and entrypoint.
        - name: tmp
          mountPath: /tmp
        {{- include "dash.tlsVolumeMount" . | nindent 8 }}
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      {{- include "dash.tlsVolume" . | nindent 6 }}
      {{- if not .Values.persistence.enabled }}
      - name: data
        emptyDir: {}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app.kubernetes.io/part-of: dash
        app.kubernetes.io/component: retrieval
    spec:
      accessModes:
        {{- toYaml .Values.persistence.accessModes | nindent 8 }}
      {{- if .Values.persistence.storageClassName }}
      storageClassName: {{ .Values.persistence.storageClassName | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size | quote }}
  {{- end }}
