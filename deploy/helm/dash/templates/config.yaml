{{- $p := .Values.config.persistencePath -}}
{{- $ns := include "dash.namespace" . -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dash.fullname" . }}-config
  namespace: {{ $ns }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  # ----- shared tunables -----
  RUST_LOG: {{ .Values.config.logLevel | quote }}
  DASH_LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  {{- if .Values.metrics.public }}
  DASH_METRICS_PUBLIC: "1"
  {{- end }}
  DASH_STRICT_SECRETS: {{ ternary "1" "0" .Values.config.strictSecrets | quote }}
  DASH_EMBEDDING_PROVIDER: {{ .Values.config.embeddingProvider | quote }}
  {{- if eq .Values.config.embeddingProvider "ollama" }}
  DASH_OLLAMA_ENDPOINT: {{ required "config.ollamaEndpoint is required when embeddingProvider=ollama" .Values.config.ollamaEndpoint | quote }}
  {{- end }}

  # ----- persistence (file paths on the per-pod PVC; redb paths are FILES) -----
  DASH_INGEST_PERSISTENCE_PATH: {{ printf "%s/state/ingestion.redb" $p | quote }}
  DASH_RETRIEVAL_PERSISTENCE_PATH: {{ printf "%s/state/retrieval.redb" $p | quote }}
  DASH_INGEST_WAL_PATH: {{ printf "%s/wal/ingestion.wal" $p | quote }}
  DASH_INGEST_SEGMENT_DIR: {{ printf "%s/segments/ingestion" $p | quote }}
  DASH_RETRIEVAL_SEGMENT_DIR: {{ printf "%s/segments/retrieval" $p | quote }}
  {{- if .Values.config.audit.enabled }}
  DASH_INGEST_AUDIT_LOG_PATH: {{ printf "%s/audit/ingestion.audit.jsonl" $p | quote }}
  DASH_RETRIEVAL_AUDIT_LOG_PATH: {{ printf "%s/audit/retrieval.audit.jsonl" $p | quote }}
  {{- end }}

  # Integers go through int64: Helm parses YAML numbers as float64 and would
  # otherwise render values >= 1e6 in exponent form (5.24288e+07), which the
  # services reject at startup.
  # ----- HTTP -----
  DASH_INGEST_HTTP_WORKERS: {{ .Values.config.http.ingestWorkers | int64 | quote }}
  DASH_INGEST_HTTP_QUEUE_CAPACITY: {{ .Values.config.http.ingestQueueCapacity | int64 | quote }}
  DASH_RETRIEVAL_HTTP_WORKERS: {{ .Values.config.http.retrievalWorkers | int64 | quote }}
  DASH_RETRIEVAL_HTTP_QUEUE_CAPACITY: {{ .Values.config.http.retrievalQueueCapacity | int64 | quote }}

  # ----- WAL durability -----
  DASH_INGEST_WAL_SYNC_EVERY_RECORDS: {{ .Values.config.wal.ingestSyncEveryRecords | int64 | quote }}
  DASH_INGEST_WAL_APPEND_BUFFER_RECORDS: {{ .Values.config.wal.ingestAppendBufferRecords | int64 | quote }}
  DASH_INGEST_WAL_ASYNC_FLUSH_INTERVAL_MS: {{ .Values.config.wal.ingestAsyncFlushIntervalMs | int64 | quote }}
  DASH_INGEST_WAL_BACKGROUND_FLUSH_ONLY: {{ .Values.config.wal.ingestBackgroundFlushOnly | quote }}
  DASH_INGEST_WAL_SYNC_INTERVAL_MS: {{ .Values.config.wal.ingestSyncIntervalMs | int64 | quote }}
  DASH_INGEST_SEGMENT_MAINTENANCE_INTERVAL_MS: {{ .Values.config.segment.ingestMaintenanceIntervalMs | int64 | quote }}

  # ----- checkpoint thresholds -----
  DASH_CHECKPOINT_MAX_WAL_RECORDS: {{ .Values.config.checkpoint.maxWalRecords | int64 | quote }}
  DASH_CHECKPOINT_MAX_WAL_BYTES: {{ .Values.config.checkpoint.maxWalBytes | int64 | quote }}

  # ----- bind addresses (inside the pod) -----
  DASH_INGEST_BIND: {{ .Values.config.bind.ingestion | quote }}
  DASH_RETRIEVAL_BIND: {{ .Values.config.bind.retrieval | quote }}
  DASH_CONTROL_PLANE_BIND: {{ .Values.config.bind.controlPlane | quote }}

  # ----- replication: every retrieval pod follows the single ingestion pod -----
  {{- if .Values.tls.enabled }}
  {{- $tls := .Values.tls.mountPath }}
  DASH_RETRIEVAL_REPLICATION_SOURCE_URL: {{ printf "https://%s.%s.svc.cluster.local:%v" (include "dash.componentName" (list . "ingestion")) $ns .Values.service.ports.http | quote }}
  DASH_REPLICATION_CA_FILE: {{ printf "%s/ca.crt" $tls | quote }}

  # ----- native TLS on every listener (docs/operations/tls.md) -----
  DASH_INGEST_TLS_CERT_FILE: {{ printf "%s/tls.crt" $tls | quote }}
  DASH_INGEST_TLS_KEY_FILE: {{ printf "%s/tls.key" $tls | quote }}
  DASH_RETRIEVAL_TLS_CERT_FILE: {{ printf "%s/tls.crt" $tls | quote }}
  DASH_RETRIEVAL_TLS_KEY_FILE: {{ printf "%s/tls.key" $tls | quote }}
  DASH_CONTROL_PLANE_TLS_CERT_FILE: {{ printf "%s/tls.crt" $tls | quote }}
  DASH_CONTROL_PLANE_TLS_KEY_FILE: {{ printf "%s/tls.key" $tls | quote }}
  {{- if .Values.tls.mutual }}
  # Ingestion verifies client certificates against ca.crt and requires one on
  # /internal/replication/*; retrieval presents its pod certificate.
  DASH_INGEST_TLS_CLIENT_CA_FILE: {{ printf "%s/ca.crt" $tls | quote }}
  DASH_INGEST_REPLICATION_REQUIRE_CLIENT_CERT: "1"
  DASH_REPLICATION_CLIENT_CERT_FILE: {{ printf "%s/tls.crt" $tls | quote }}
  DASH_REPLICATION_CLIENT_KEY_FILE: {{ printf "%s/tls.key" $tls | quote }}
  {{- end }}
  {{- else }}
  DASH_RETRIEVAL_REPLICATION_SOURCE_URL: {{ printf "http://%s.%s.svc.cluster.local:%v" (include "dash.componentName" (list . "ingestion")) $ns .Values.service.ports.http | quote }}
  # TLS is off (tls.enabled=false): replication is plain http inside the
  # cluster, and this acknowledges that the token and WAL stream cross the pod
  # network unencrypted. Set tls.enabled=true instead (docs/operations/tls.md).
  DASH_REPLICATION_ALLOW_INSECURE_HTTP: "1"
  {{- end }}
  DASH_RETRIEVAL_REPLICATION_POLL_INTERVAL_MS: {{ .Values.config.replication.pollIntervalMs | int64 | quote }}
  DASH_RETRIEVAL_REPLICATION_OFFSET_PATH: {{ printf "%s/state/retrieval-replication.offset" $p | quote }}

  {{- if .Values.encryption.enabled }}
  # ----- encryption at rest (docs/operations/encryption.md) -----
  {{- $enc := .Values.encryption }}
  DASH_ENCRYPTION_KEY_FILE: {{ printf "%s/%s" $enc.mountPath $enc.keyName | quote }}
  {{- if $enc.previousKeyNames }}
  {{- $prev := list }}
  {{- range $enc.previousKeyNames }}
  {{- $prev = append $prev (printf "%s/%s" $enc.mountPath .) }}
  {{- end }}
  DASH_ENCRYPTION_PREVIOUS_KEY_FILES: {{ join "," $prev | quote }}
  {{- end }}
  {{- end }}

  {{- if .Values.failover.enabled }}
  {{- if not .Values.controlPlane.enabled }}
  {{- fail "failover.enabled requires controlPlane.enabled" }}
  {{- end }}
  # ----- automatic failover of the ingestion leader (docs/operations/failover.md) -----
  {{- $f := .Values.failover }}
  DASH_CONTROL_PLANE_INGEST_FAILOVER: "1"
  DASH_CONTROL_PLANE_INGEST_LEASE_MS: {{ $f.leaseMs | int64 | quote }}
  DASH_CONTROL_PLANE_INGEST_PROMOTION_GRACE_MS: {{ $f.promotionGraceMs | int64 | quote }}
  DASH_INGEST_FAILOVER_CONTROL_PLANE_URL: {{ printf "%s://%s.%s.svc.cluster.local:%v" (ternary "https" "http" .Values.tls.enabled) (include "dash.componentName" (list . "control-plane")) $ns .Values.service.ports.controlPlane | quote }}
  DASH_INGEST_FAILOVER_HEARTBEAT_INTERVAL_MS: {{ $f.heartbeatIntervalMs | int64 | quote }}
  DASH_INGEST_MIN_SYNC_REPLICAS: {{ $f.minSyncReplicas | int64 | quote }}
  DASH_INGEST_SYNC_REPLICATION_TIMEOUT_MS: {{ $f.syncTimeoutMs | int64 | quote }}
  DASH_INGEST_SYNC_REPLICATION_ON_TIMEOUT: {{ $f.syncOnTimeout | quote }}
  DASH_INGEST_REPLICATION_POLL_INTERVAL_MS: {{ .Values.config.replication.pollIntervalMs | int64 | quote }}
  {{- if .Values.tls.enabled }}
  DASH_ROUTER_CONTROL_PLANE_CA_FILE: {{ printf "%s/ca.crt" .Values.tls.mountPath | quote }}
  {{- else }}
  # TLS is off: the heartbeat's control-plane token crosses the pod network
  # unencrypted (as the replication token does). Prefer tls.enabled=true.
  DASH_ROUTER_ALLOW_INSECURE_HTTP: "1"
  {{- end }}
  {{- end }}

  # ----- control plane -----
  DASH_CONTROL_PLANE_STATE_PATH: {{ printf "%s/state/control-plane.csv" $p | quote }}
  DASH_CONTROL_PLANE_STATE_SHA256_PATH: {{ printf "%s/state/control-plane.csv.sha256" $p | quote }}
  DASH_CONTROL_PLANE_LEASE_PATH: {{ printf "%s/state/control-plane.lease" $p | quote }}
  DASH_CONTROL_PLANE_LEASE_DURATION_MS: {{ .Values.config.controlPlane.leaseDurationMs | int64 | quote }}
  DASH_CONTROL_PLANE_LEASE_RENEWAL_MS: {{ .Values.config.controlPlane.leaseRenewalMs | int64 | quote }}
