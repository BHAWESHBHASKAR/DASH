{{- /*
Chart-managed Secrets. One Secret per component so that a compromised pod
only sees the keys it needs. A component's Secret is rendered only when
secret.existingSecret.<component> is empty; otherwise the named Secret must
already exist (External Secrets, Sealed Secrets, SOPS, kubectl create secret).
Every value is required, at least 32 characters, and must not be a placeholder.
*/ -}}
{{- $openai := eq .Values.config.embeddingProvider "openai" -}}
{{- if not .Values.secret.existingSecret.retrieval }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dash.retrievalSecretName" . }}
  namespace: {{ include "dash.namespace" . }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: retrieval
type: Opaque
stringData:
  DASH_RETRIEVAL_API_KEY: {{ include "dash.secretValue" (list .Values.secret.retrieval.apiKey "secret.retrieval.apiKey") | quote }}
  DASH_RETRIEVAL_JWT_HS256_SECRET: {{ include "dash.secretValue" (list .Values.secret.retrieval.hs256Secret "secret.retrieval.hs256Secret") | quote }}
  DASH_RETRIEVAL_REPLICATION_TOKEN: {{ include "dash.secretValue" (list .Values.secret.replicationToken "secret.replicationToken") | quote }}
  {{- if $openai }}
  DASH_OPENAI_API_KEY: {{ required "secret.openaiApiKey is required when config.embeddingProvider=openai" .Values.secret.openaiApiKey | quote }}
  {{- end }}
{{- end }}
{{- if not .Values.secret.existingSecret.ingestion }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dash.ingestionSecretName" . }}
  namespace: {{ include "dash.namespace" . }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
type: Opaque
stringData:
  DASH_INGEST_API_KEY: {{ include "dash.secretValue" (list .Values.secret.ingestion.apiKey "secret.ingestion.apiKey") | quote }}
  DASH_INGEST_JWT_HS256_SECRET: {{ include "dash.secretValue" (list .Values.secret.ingestion.hs256Secret "secret.ingestion.hs256Secret") | quote }}
  DASH_INGEST_REPLICATION_TOKEN: {{ include "dash.secretValue" (list .Values.secret.replicationToken "secret.replicationToken") | quote }}
  {{- if $openai }}
  DASH_OPENAI_API_KEY: {{ required "secret.openaiApiKey is required when config.embeddingProvider=openai" .Values.secret.openaiApiKey | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.controlPlane.enabled (not .Values.secret.existingSecret.controlPlane) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dash.controlPlaneSecretName" . }}
  namespace: {{ include "dash.namespace" . }}
  labels:
    {{- include "dash.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
type: Opaque
stringData:
  DASH_CONTROL_PLANE_TOKEN: {{ include "dash.secretValue" (list .Values.secret.controlPlane.token "secret.controlPlane.token") | quote }}
{{- end }}
