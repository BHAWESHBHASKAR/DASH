---
# Voluntary disruption budget for retrieval: at most one replica may be
# disrupted at a time. Ingestion and control-plane are single-replica
# StatefulSets; a minAvailable budget on them would block node drains
# forever, so they intentionally have none.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dash-retrieval
  namespace: dash-system
  labels:
    app.kubernetes.io/part-of: dash
    app.kubernetes.io/name: dash
    app.kubernetes.io/component: retrieval
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dash
      app.kubernetes.io/component: retrieval
