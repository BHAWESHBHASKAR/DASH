---
# Ingestion service: the single writer. It owns the WAL and redb store;
# retrieval pods replicate from it. Exactly one replica is supported until
# the clustering phase (a second writer would diverge); do not scale it and
# do not attach a HorizontalPodAutoscaler.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dash-ingestion
  namespace: dash-system
  labels:
    app.kubernetes.io/part-of: dash
    app.kubernetes.io/name: dash
    app.kubernetes.io/component: ingestion
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: dash-ingestion
  namespace: dash-system
  labels:
    app.kubernetes.io/part-of: dash
    app.kubernetes.io/name: dash
    app.kubernetes.io/component: ingestion
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dash
    app.kubernetes.io/component: ingestion
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
    appProtocol: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dash-ingestion
  namespace: dash-system
  labels:
    app.kubernetes.io/part-of: dash
    app.kubernetes.io/name: dash
    app.kubernetes.io/component: ingestion
spec:
  serviceName: dash-ingestion
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: dash
      app.kubernetes.io/component: ingestion
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: dash
        app.kubernetes.io/name: dash
        app.kubernetes.io/component: ingestion
    spec:
      serviceAccountName: dash-ingestion
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      initContainers:
      # A fresh PVC is empty; create the directories the service writes to.
      - name: init-data-dirs
        image: ghcr.io/bhaweshbhaskar/dash-ingestion:0.2.0
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c", "mkdir -p /var/lib/dash/wal /var/lib/dash/state /var/lib/dash/segments /var/lib/dash/audit"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/dash
      containers:
      - name: ingestion
        image: ghcr.io/bhaweshbhaskar/dash-ingestion:0.2.0
        imagePullPolicy: IfNotPresent
        # Matches the image ENTRYPOINT (/opt/dash/bin/dash-entrypoint), which
        # selects the binary from DASH_BIN.
        command: ["/opt/dash/bin/dash-entrypoint"]
        args: ["--serve"]
        env:
        - name: DASH_BIN
          value: "ingestion"
        envFrom:
        - configMapRef:
            name: dash-config
        - secretRef:
            name: dash-ingestion-secrets
        ports:
        - name: http
          containerPort: 8081
          protocol: TCP
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
            ephemeral-storage: 512Mi
        # Startup gates only "the process is up" (/v1/live). /v1/ready also
        # requires a reachable, caught-up replication leader on retrieval, so
        # using it here restarted followers in a loop while ingestion was down.
        startupProbe:
          httpGet:
            path: /v1/live
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /v1/live
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/dash
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app.kubernetes.io/part-of: dash
        app.kubernetes.io/component: ingestion
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 10Gi
