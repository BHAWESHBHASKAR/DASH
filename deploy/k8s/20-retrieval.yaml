---
# Retrieval service: serves /v1/retrieve and /v1/embeddings. Each replica
# keeps its own redb store and WAL-derived state on its own RWO PVC and
# follows the single ingestion pod through the replication endpoint
# (DASH_RETRIEVAL_REPLICATION_SOURCE_URL in dash-config). Scale it by hand
# (`kubectl -n dash-system scale statefulset dash-retrieval --replicas=N`);
# a new replica starts empty and catches up from the ingestion export.
# There is no HorizontalPodAutoscaler: a StatefulSet replica is not
# interchangeable until the clustering phase lands.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dash-retrieval
  namespace: dash-system
  labels:
    app.kubernetes.io/part-of: dash
    app.kubernetes.io/name: dash
    app.kubernetes.io/component: retrieval
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: dash-retrieval
  namespace: dash-system
  labels:
    app.kubernetes.io/part-of: dash
    app.kubernetes.io/name: dash
    app.kubernetes.io/component: retrieval
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dash
    app.kubernetes.io/component: retrieval
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
    appProtocol: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dash-retrieval
  namespace: dash-system
  labels:
    app.kubernetes.io/part-of: dash
    app.kubernetes.io/name: dash
    app.kubernetes.io/component: retrieval
spec:
  serviceName: dash-retrieval
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: dash
      app.kubernetes.io/component: retrieval
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: dash
        app.kubernetes.io/name: dash
        app.kubernetes.io/component: retrieval
    spec:
      serviceAccountName: dash-retrieval
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: dash
                  app.kubernetes.io/component: retrieval
      terminationGracePeriodSeconds: 30
      initContainers:
      # A fresh PVC is empty; create the directories the service writes to.
      - name: init-data-dirs
        image: ghcr.io/bhaweshbhaskar/dash-retrieval:0.2.0
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c", "mkdir -p /var/lib/dash/state /var/lib/dash/segments /var/lib/dash/audit"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 32Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/dash
      containers:
      - name: retrieval
        image: ghcr.io/bhaweshbhaskar/dash-retrieval:0.2.0
        imagePullPolicy: IfNotPresent
        # Matches the image ENTRYPOINT (/opt/dash/bin/dash-entrypoint), which
        # selects the binary from DASH_BIN.
        command: ["/opt/dash/bin/dash-entrypoint"]
        args: ["--serve"]
        env:
        - name: DASH_BIN
          value: "retrieval"
        envFrom:
        - configMapRef:
            name: dash-config
        - secretRef:
            name: dash-retrieval-secrets
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
            ephemeral-storage: 512Mi
        # Startup gates only "the process is up" (/v1/live). /v1/ready also
        # requires a reachable, caught-up replication leader on retrieval, so
        # using it here restarted followers in a loop while ingestion was down.
        startupProbe:
          httpGet:
            path: /v1/live
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /v1/live
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/dash
        # Writable scratch space. /opt/dash is NOT mounted over: it holds
        # the image's binaries and entrypoint.
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app.kubernetes.io/part-of: dash
        app.kubernetes.io/component: retrieval
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 10Gi
