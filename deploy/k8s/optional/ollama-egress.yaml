# Optional: allow retrieval and ingestion pods to reach an in-cluster Ollama
# server on private (RFC 1918) addresses. Apply only when
# DASH_EMBEDDING_PROVIDER=ollama and DASH_OLLAMA_ENDPOINT points inside the
# cluster:
#
#   kubectl apply -f deploy/k8s/optional/ollama-egress.yaml
#
# Tighten the ipBlocks to your Ollama Service/pod CIDR where possible. Adjust
# the port if Ollama listens elsewhere. Do not add this file to the base
# kustomization.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ollama-egress
  namespace: dash-system
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/component
      operator: In
      values: [retrieval, ingestion]
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 10.0.0.0/8
    - ipBlock:
        cidr: 172.16.0.0/12
    - ipBlock:
        cidr: 192.168.0.0/16
    ports:
    - port: 11434
      protocol: TCP
