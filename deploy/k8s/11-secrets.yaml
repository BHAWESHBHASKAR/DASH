# Secrets are intentionally NOT committed. The workloads reference three
# Secrets that you create out-of-band BEFORE applying these manifests:
#
#   dash-retrieval-secrets     keys: DASH_RETRIEVAL_API_KEY
#                                    DASH_RETRIEVAL_JWT_HS256_SECRET
#                                    DASH_RETRIEVAL_REPLICATION_TOKEN
#   dash-ingestion-secrets     keys: DASH_INGEST_API_KEY
#                                    DASH_INGEST_JWT_HS256_SECRET
#                                    DASH_INGEST_REPLICATION_TOKEN
#   dash-control-plane-secrets keys: DASH_CONTROL_PLANE_TOKEN
#
# The replication token must be identical in the ingestion and retrieval
# Secrets. All values must be at least 32 random characters; strict secret
# validation (DASH_STRICT_SECRETS=1) rejects placeholders and short values.
#
# Example using kubectl and openssl (nothing is written to disk):
#
#   kubectl create namespace dash-system
#   REPL="$(openssl rand -hex 32)"
#   kubectl -n dash-system create secret generic dash-retrieval-secrets \
#     --from-literal=DASH_RETRIEVAL_API_KEY="$(openssl rand -hex 32)" \
#     --from-literal=DASH_RETRIEVAL_JWT_HS256_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DASH_RETRIEVAL_REPLICATION_TOKEN="$REPL"
#   kubectl -n dash-system create secret generic dash-ingestion-secrets \
#     --from-literal=DASH_INGEST_API_KEY="$(openssl rand -hex 32)" \
#     --from-literal=DASH_INGEST_JWT_HS256_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DASH_INGEST_REPLICATION_TOKEN="$REPL"
#   kubectl -n dash-system create secret generic dash-control-plane-secrets \
#     --from-literal=DASH_CONTROL_PLANE_TOKEN="$(openssl rand -hex 32)"
#
# For GitOps, use External Secrets, Sealed Secrets or SOPS instead. An
# ExternalSecret template for the retrieval Secret (repeat for the others):
#
#   apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   metadata:
#     name: dash-retrieval-secrets
#     namespace: dash-system
#   spec:
#     refreshInterval: 1h
#     secretStoreRef: {kind: ClusterSecretStore, name: <your-store>}
#     target: {name: dash-retrieval-secrets}
#     data:
#       - {secretKey: DASH_RETRIEVAL_API_KEY, remoteRef: {key: dash/retrieval, property: api-key}}
#       - {secretKey: DASH_RETRIEVAL_JWT_HS256_SECRET, remoteRef: {key: dash/retrieval, property: jwt-hs256}}
#       - {secretKey: DASH_RETRIEVAL_REPLICATION_TOKEN, remoteRef: {key: dash/replication, property: token}}
#
# If you use an embedding provider that needs an API key (openai), add
# DASH_OPENAI_API_KEY to the retrieval and ingestion Secrets.
#
# This file is deliberately not listed in kustomization.yaml and contains no
# resources.
