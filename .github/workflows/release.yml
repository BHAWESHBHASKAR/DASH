# release.yml
# Release pipeline: cross-compile ingestion/retrieval/control-plane binaries
# for 4 targets, build and push multi-arch Docker images to ghcr.io, and
# publish a GitHub Release. Every published artifact is covered by an SBOM,
# a keyless Sigstore signature and a SLSA build-provenance attestation.
#
# Image naming (shared with Helm, deploy/k8s and docker compose):
#   ghcr.io/<owner>/dash-<service>:<version>   service = ingestion | retrieval | control-plane
# The same Dockerfile builds every image; the SERVICE build arg sets DASH_BIN.
#
# Supply chain (verification steps: docs/operations/supply-chain.md):
#   binaries      CycloneDX SBOM per binary and target (cargo-cyclonedx),
#                 cosign sign-blob bundle (<file>.cosign.bundle) per file,
#                 SHA256SUMS, GitHub build-provenance attestation.
#   images        SPDX SBOM (syft) attached as a cosign attestation, cosign
#                 signature on the pushed digest, GitHub build-provenance
#                 attestation pushed to the registry.
# Signing is keyless: the GitHub OIDC token of this workflow run is
# exchanged for a short-lived Fulcio certificate and every signature is
# logged in Rekor. `id-token: write` is granted only to the two signing
# jobs (docker, sign-artifacts); the job that writes the release has no
# OIDC token, and the signing jobs cannot write repository contents.
#
# Every third-party action is pinned to a full commit SHA (tag in the
# trailing comment); tools installed with cargo use --locked and an exact
# version.
#
# Triggered by pushing a tag matching v* (e.g. v0.1.0).
# Expected runtime: ~20-30 minutes.
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  binaries:
    name: Cross-compile binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (no release tags)
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cross and cargo-cyclonedx
        run: |
          cargo install cross --locked --version 0.2.5
          cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Build ingestion (${{ matrix.target }})
        run: |
          cross build --release --locked --target ${{ matrix.target }} -p ingestion

      - name: Build retrieval (${{ matrix.target }})
        run: |
          cross build --release --locked --target ${{ matrix.target }} -p retrieval

      - name: Build control-plane (${{ matrix.target }})
        run: |
          cross build --release --locked --target ${{ matrix.target }} -p control-plane

      # One CycloneDX 1.5 document per workspace member, resolved for this
      # target from Cargo.lock; the three service SBOMs are published.
      - name: Generate CycloneDX SBOMs (${{ matrix.target }})
        run: |
          cargo cyclonedx --format json --spec-version 1.5 \
            --target ${{ matrix.target }} --override-filename dash-sbom.cdx

      - name: Package artifacts
        run: |
          mkdir -p release-artifacts
          for bin in ingestion retrieval control-plane; do
            src="target/${{ matrix.target }}/release/$bin"
            if [ -f "$src" ]; then
              cp "$src" "release-artifacts/${bin}-${{ matrix.target }}"
            fi
            cp "services/${bin}/dash-sbom.cdx.json" \
              "release-artifacts/${bin}-${{ matrix.target }}.cdx.json"
          done
          ls -la release-artifacts

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dash-binaries-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error

  docker:
    name: Build, push & sign Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: binaries
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing and GitHub attestations for the image.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion, retrieval, control-plane]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute lowercase image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${owner}/dash-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: deploy/container/Dockerfile
          target: runtime
          build-args: |
            SERVICE=${{ matrix.service }}
            DASH_GIT_SHA=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dash-release
          cache-to: type=gha,mode=max,scope=dash-release

      - name: Generate image SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: dash-${{ matrix.service }}-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1

      # Sign the digest, never a tag: the signature covers exactly the bytes
      # that were pushed. The SBOM is attached as a signed in-toto
      # attestation on the same digest.
      - name: Sign image and attest its SBOM (keyless)
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          SBOM: dash-${{ matrix.service }}-image.spdx.json
        run: |
          cosign sign --yes "${IMAGE}"
          cosign attest --yes --type spdxjson --predicate "${SBOM}" "${IMAGE}"

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record image digest
        run: |
          echo "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}" \
            > "dash-${{ matrix.service }}-image.digest"

      - name: Upload image SBOM and digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.service }}
          path: |
            dash-${{ matrix.service }}-image.spdx.json
            dash-${{ matrix.service }}-image.digest
          if-no-files-found: error

  sign-artifacts:
    name: Sign & attest release files
    runs-on: ubuntu-latest
    needs: [binaries, docker]
    permissions:
      contents: read
      # Keyless cosign signing and GitHub attestations for the files.
      id-token: write
      attestations: write
    steps:
      - name: Download binaries, SBOMs and image records
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist

      - name: Flatten and checksum
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance of every release file
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-checksums: release/SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1

      # One Sigstore bundle per file (signature, certificate and Rekor
      # inclusion proof), including SHA256SUMS itself.
      - name: Sign every release file (keyless)
        run: |
          set -euo pipefail
          cd release
          for f in *; do
            case "$f" in *.cosign.bundle) continue ;; esac
            cosign sign-blob --yes --bundle "${f}.cosign.bundle" "$f"
          done
          ls -la

      - name: Upload signed release set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dash-release-signed
          path: release/*
          if-no-files-found: error

  # Release checklist item (docs/operations/upgrades.md): the tagged release
  # ships its upgrade-compatibility fixture, so later releases are tested
  # against the state it writes.
  upgrade-fixture:
    name: Upgrade fixture present
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check the fixture for this tag
        run: scripts/compat/check_release_fixture.sh "${GITHUB_REF_NAME}"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [sign-artifacts, upgrade-fixture]
    permissions:
      contents: write
    steps:
      - name: Download signed release set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dash-release-signed
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
