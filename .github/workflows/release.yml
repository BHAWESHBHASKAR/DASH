# release.yml
# Release pipeline: cross-compile ingestion/retrieval/control-plane binaries
# for 4 targets, publish them as a GitHub Release, build and push multi-arch
# Docker images to ghcr.io, and attach an SBOM.
#
# Image naming (shared with Helm, deploy/k8s and docker compose):
#   ghcr.io/<owner>/dash-<service>:<version>   service = ingestion | retrieval | control-plane
# The same Dockerfile builds every image; the SERVICE build arg sets DASH_BIN.
#
# Triggered by pushing a tag matching v* (e.g. v0.1.0).
# Expected runtime: ~20-30 minutes.
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  binaries:
    name: Cross-compile binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (no release tags)
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build ingestion (${{ matrix.target }})
        run: |
          cross build --release --locked --target ${{ matrix.target }} -p ingestion

      - name: Build retrieval (${{ matrix.target }})
        run: |
          cross build --release --locked --target ${{ matrix.target }} -p retrieval

      - name: Build control-plane (${{ matrix.target }})
        run: |
          cross build --release --locked --target ${{ matrix.target }} -p control-plane

      - name: Package artifacts
        run: |
          mkdir -p release-artifacts
          for bin in ingestion retrieval control-plane; do
            src="target/${{ matrix.target }}/release/$bin"
            if [ -f "$src" ]; then
              cp "$src" "release-artifacts/${bin}-${{ matrix.target }}"
            fi
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dash-binaries-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error

  docker:
    name: Build & push Docker image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: binaries
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion, retrieval, control-plane]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute lowercase image owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/dash-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: deploy/container/Dockerfile
          target: runtime
          build-args: |
            SERVICE=${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dash-release
          cache-to: type=gha,mode=max,scope=dash-release

      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          artifact-name: sbom-${{ matrix.service }}.spdx.json
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: spdx-json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          if-no-files-found: warn

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [binaries, docker]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download all binary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f -name "*-*" -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
