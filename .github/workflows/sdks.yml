# sdks.yml
# CI for the DASH language SDKs: Go, Python, TypeScript, Java, Kotlin and C#.
# Runs on push/PR to main when anything under sdks/** (or this workflow) changes;
# one parallel job per language. Expected runtime: ~3-8 minutes per job.
name: SDKs CI

on:
  push:
    branches: [main]
    paths:
      - "sdks/**"
      - ".github/workflows/sdks.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdks/**"
      - ".github/workflows/sdks.yml"

concurrency:
  group: sdks-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repository.
permissions:
  contents: read

jobs:
  go:
    name: Go SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go 1.22
        uses: actions/setup-go@v5.5.0
        with:
          go-version: "1.22"
          cache-dependency-path: sdks/go/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test (race detector)
        run: go test -race ./...

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            sdks/python/pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e '.[test]'

      - name: pytest
        run: pytest -v

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

      - name: npm test
        run: npm test

  java:
    name: Java SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: sdks/java/pom.xml

      - name: mvn test
        run: mvn --batch-mode --no-transfer-progress test

  kotlin:
    name: Kotlin SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: sdks/java/pom.xml

      # dash-kotlin wraps dash-java, which is not published yet: install it
      # into the local Maven repository so Gradle resolves it via mavenLocal().
      - name: Install dash-java locally
        working-directory: sdks/java
        run: mvn --batch-mode --no-transfer-progress install -DskipTests

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4.4.1
        with:
          gradle-version: "8.14.3"

      - name: gradle test
        working-directory: sdks/kotlin
        run: gradle test --no-daemon --console=plain

  csharp:
    name: C# SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/csharp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: dotnet build (all target frameworks)
        run: dotnet build Dash.sln --configuration Release

      - name: dotnet test
        run: dotnet test tests/Dash.Tests --configuration Release --no-build

  surface-check:
    name: SDK surface check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Removed delete API stays removed; READMEs match the server routes
        run: scripts/check_sdk_surface.sh

      - name: Surface check catches planted violations
        run: scripts/check_sdk_surface.sh --self-test
