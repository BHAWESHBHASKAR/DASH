# rust.yml
# CI for the DASH Rust workspace: fmt, clippy, tests, release build.
# Runs on every push/PR to main across Ubuntu and macOS.
# Expected runtime: ~8-15 minutes per matrix leg.
name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: [rustfmt, clippy]

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build docs (all features)
        run: cargo doc --workspace --all-features --no-deps

      - name: Run tests (all features)
        # Single-threaded: retrieval tests rely on process-global env
        # variables/locks that are not safe under the default runner.
        run: cargo test --workspace --all-features -- --test-threads=1

      - name: Release build
        run: cargo build --workspace --release

  backup-restore-drill:
    name: Backup/Restore Drill (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: rust
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Docker Compose
        run: docker compose version

      - name: Run backup/restore drill
        run: bash scripts/backup_restore_drill.sh
