# dependabot.yml
# Automated dependency updates for the DASH monorepo.
# Grouped per ecosystem to keep PR volume manageable.
version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(rust)"
    labels:
      - "dependencies"
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/sdks/python"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(python)"
    labels:
      - "dependencies"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/sdks/go"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(go)"
    labels:
      - "dependencies"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/sdks/typescript"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(ts)"
    labels:
      - "dependencies"
    groups:
      typescript-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "maven"
    directory: "/sdks/java"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(java)"
    labels:
      - "dependencies"
    groups:
      java-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/sdks/kotlin"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(kotlin)"
    labels:
      - "dependencies"
    groups:
      kotlin-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/sdks/csharp"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(csharp)"
    labels:
      - "dependencies"
    groups:
      csharp-dependencies:
        patterns:
          - "*"

  # Actions are pinned to commit SHAs with a `# vX.Y.Z` comment; Dependabot
  # updates the SHA and the comment together. "/" makes it scan
  # .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci(actions)"
    labels:
      - "dependencies"
    groups:
      github-actions-updates:
        patterns:
          - "*"

  # Base images in the Dockerfile are pinned by digest (tag@sha256:...);
  # Dependabot bumps both.
  - package-ecosystem: "docker"
    directory: "/deploy/container"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencies"
