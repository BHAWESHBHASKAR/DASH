[package]
name = "dash-http"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true
description = "Shared std-thread HTTP/1.1 server and strict request parser for DASH services"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = { workspace = true }
webpki-roots = "0.26"

[dev-dependencies]
dash-tls-fixtures = { path = "../../tests/tls-fixtures" }
