[package]
name = "store"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true

[features]
# Historical GPU compute path. The code is feature-gated so it can be
# re-enabled without rewriting the call sites. With the feature off (default),
# the wgpu/kosmic backends are compiled out and the store falls back to CPU
# cosine via `usearch`.
gpu-backend = []

[dependencies]
schema = { path = "../schema" }
ranking = { path = "../ranking" }
graph = { path = "../graph" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
redb = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
usearch = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
dash-observe = { path = "../observe", default-features = false }
unicode-segmentation = "1.12"
rust-stemmers = "1.2"
encryption = { path = "../encryption" }

[dev-dependencies]
tempfile = "3"
embeddings = { path = "../embeddings" }
serde_json = { workspace = true }
