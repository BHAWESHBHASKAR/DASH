[package]
name = "encryption"
version.workspace = true
edition.workspace = true

[features]
default = []
aws-kms = ["dep:aws-config", "dep:aws-sdk-kms", "dep:tokio"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "getrandom"] }
aws-config = { version = "1", optional = true, default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-kms = { version = "1", optional = true, default-features = false, features = ["rt-tokio", "default-https-client"] }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
